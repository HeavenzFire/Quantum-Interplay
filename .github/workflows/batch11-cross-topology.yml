name: Batch 11 cross-topology validation

on:
  push:
    branches:
      - research/batch11-cross-topology-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch11:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python experiments/phase_batch11_cross_topology.py
      - name: Upload Batch 11 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: batch11-cross-topology-results
          path: |
            experiments/phase-batch11-cross-topology-report.json
            experiments/phase-batch11-cross-topology-replicates.csv
